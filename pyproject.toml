[project]
name = "phishdetector"
version = "0.1.0"
description = "Local, explainable phishing email triage CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
phishdetector = "phishdetector.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.5"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
